<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 185" width="460" height="185" role="img" aria-labelledby="title desc">
  <title id="title">Frontend developer workspace</title>
  <desc id="desc">A dark themed animated frontend interface with code, browser layout, responsive preview, and Bijoy.dev label.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117}
      .panel{fill:#111820;stroke:#30363d;stroke-width:1}
      .soft{fill:#161b22;stroke:#30363d;stroke-width:1}
      .muted{fill:#8b949e;font-family:'JetBrains Mono','Courier New',monospace}
      .tiny{font-size:6px;letter-spacing:1px}
      .label{font-size:8px;letter-spacing:1.5px}
      .code{font-size:7px;font-family:'JetBrains Mono','Courier New',monospace}
      .white{fill:#f0f6fc}
      .blue{fill:#58a6ff}
      .green{fill:#3fb950}
      .orange{fill:#f0883e}
      .pink{fill:#db61a2}
      .line{stroke:#30363d;stroke-width:1}
      .accent{stroke:#58a6ff;stroke-width:1.2;fill:none}
      .glow{filter:url(#glow)}
      @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
      @keyframes rise{0%,20%{transform:translateY(7px);opacity:0}35%,85%{transform:translateY(0);opacity:1}100%{transform:translateY(-3px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes scan{0%{transform:translateX(-120px)}100%{transform:translateX(132px)}}
      @keyframes tap{0%,65%,100%{transform:translate(0,0)}72%,78%{transform:translate(4px,3px)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      .toast{animation:rise 6s ease-in-out infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .scan{animation:scan 4.8s linear infinite}
      .tap{animation:tap 4s ease-in-out infinite}
      .float{animation:float 5s ease-in-out infinite}
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="screen" x1="70" y1="33" x2="333" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="460" height="185"/>

  <text class="muted label" x="24" y="22">FRONTEND WORKSPACE</text>
  <text class="muted label" x="356" y="22">BIJOY.DEV</text>

  <g class="float">
    <rect x="26" y="34" width="282" height="126" rx="8" fill="url(#screen)" stroke="#30363d"/>
    <rect x="26" y="34" width="282" height="19" rx="8" fill="#161b22"/>
    <rect x="26" y="45" width="282" height="8" fill="#161b22"/>
    <circle cx="40" cy="44" r="3" fill="#ff7b72"/>
    <circle cx="52" cy="44" r="3" fill="#f0883e"/>
    <circle cx="64" cy="44" r="3" fill="#3fb950"/>
    <rect x="87" y="39" width="122" height="9" rx="4.5" fill="#0d1117" stroke="#30363d"/>
    <text class="muted tiny" x="98" y="46">almamudbijoy.app</text>

    <rect x="42" y="67" width="84" height="75" rx="5" class="soft"/>
    <text class="code blue" x="51" y="82">&lt;section&gt;</text>
    <text class="code green" x="58" y="96">class=</text>
    <text class="code orange" x="86" y="96">"hero"</text>
    <text class="code pink" x="58" y="110">React()</text>
    <text class="code blue" x="51" y="128">&lt;/section&gt;</text>
    <rect x="108" y="122" width="7" height="10" class="white cursor"/>

    <rect x="144" y="67" width="143" height="75" rx="5" class="soft"/>
    <rect x="156" y="80" width="61" height="6" rx="3" fill="#f0f6fc"/>
    <rect x="156" y="92" width="101" height="4" rx="2" fill="#30363d"/>
    <rect x="156" y="101" width="78" height="4" rx="2" fill="#30363d"/>
    <rect x="156" y="116" width="44" height="13" rx="4" fill="#238636"/>
    <rect x="207" y="116" width="38" height="13" rx="4" fill="#21262d" stroke="#30363d"/>
    <rect x="257" y="78" width="17" height="17" rx="4" fill="#0d1117" stroke="#58a6ff"/>
    <path d="M262 87h7M265.5 83.5v7" stroke="#58a6ff" stroke-width="1.1"/>

    <g opacity=".9">
      <rect x="157" y="135" width="18" height="3" rx="1.5" fill="#58a6ff"/>
      <rect x="181" y="135" width="18" height="3" rx="1.5" fill="#3fb950"/>
      <rect x="205" y="135" width="18" height="3" rx="1.5" fill="#f0883e"/>
      <rect x="229" y="135" width="18" height="3" rx="1.5" fill="#db61a2"/>
    </g>

    <g clip-path="inset(67px 0 0 144px round 5px)">
      <rect class="scan" x="144" y="67" width="34" height="75" fill="#58a6ff" opacity=".08"/>
    </g>
  </g>

  <g>
    <rect x="330" y="50" width="83" height="106" rx="9" class="panel"/>
    <rect x="339" y="63" width="65" height="82" rx="4" fill="#0d1117" stroke="#30363d"/>
    <rect x="348" y="75" width="37" height="5" rx="2.5" class="white"/>
    <rect x="348" y="87" width="47" height="3.5" rx="1.75" fill="#30363d"/>
    <rect x="348" y="96" width="32" height="3.5" rx="1.75" fill="#30363d"/>
    <rect x="348" y="111" width="19" height="18" rx="4" fill="#161b22" stroke="#30363d"/>
    <rect x="374" y="111" width="19" height="18" rx="4" fill="#161b22" stroke="#30363d"/>
    <circle cx="371.5" cy="151" r="2.5" fill="#30363d"/>
    <path class="tap" d="M392 132l18 10-8 2 4 8-5 2-4-8-5 5z" fill="#f0f6fc" stroke="#0d1117" stroke-width=".8"/>
  </g>

  <g class="toast">
    <rect x="315" y="35" width="114" height="25" rx="6" fill="#111820" stroke="#30363d"/>
    <circle cx="329" cy="47.5" r="4" fill="#3fb950"/>
    <text class="muted tiny" x="340" y="45">DEPLOYED</text>
    <text class="code white" x="340" y="54">UI build passed</text>
  </g>

  <g class="pulse glow">
    <circle cx="309" cy="107" r="3" fill="#58a6ff"/>
    <path d="M292 116c8-8 15-11 23-14" class="accent"/>
  </g>

  <g>
    <rect x="27" y="168" width="78" height="7" rx="3.5" fill="#161b22"/>
    <rect x="116" y="168" width="58" height="7" rx="3.5" fill="#161b22"/>
    <rect x="185" y="168" width="92" height="7" rx="3.5" fill="#161b22"/>
    <rect x="288" y="168" width="65" height="7" rx="3.5" fill="#161b22"/>
    <text class="muted tiny" x="38" y="174">REACT</text>
    <text class="muted tiny" x="127" y="174">TAILWIND</text>
    <text class="muted tiny" x="196" y="174">TYPESCRIPT</text>
    <text class="muted tiny" x="299" y="174">RESPONSIVE</text>
  </g>
</svg>
